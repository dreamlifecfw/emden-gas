<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مجمعين الغاز - Emden</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f2f2;--mut:#9aa0ab;--ac:#f5c518;--ok:#2ecc71;--no:#e74c3c;--bd:#2a2e38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f7;--card:#fff;--tx:#14161a;--mut:#667;--bd:#dde}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.hide{display:none!important}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;padding:24px;text-align:center;transition:opacity .6s}
#splash div{max-width:420px;border:2px solid var(--ac);border-radius:16px;padding:28px;background:var(--card);font-size:1.15rem;line-height:1.9}
#splash b{color:var(--ac)}
.box{max-width:380px;margin:8vh auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1,h2{margin:0 0 12px;color:var(--ac)}h2{font-size:1.05rem}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-size:1rem;font-weight:bold;background:var(--ac);color:#111}
button.g{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok);color:#fff}button.no{background:var(--no);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.msg{color:var(--mut);margin-top:8px;min-height:1.2em}.err{color:var(--no)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px;max-width:1000px;margin:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.row button{flex:1}
.u{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd);gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.on{background:var(--ok)}.off{background:var(--no)}.tag{font-size:.8rem;color:var(--mut)}
#chat{height:320px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:8px;border:1px solid var(--bd)}
.m{padding:6px 8px;margin:4px 0;border-radius:8px;background:var(--card)}.m b{color:var(--ac)}.m small{color:var(--mut);margin-right:6px}
.m.gas{border-right:4px solid var(--ok)}
#modal{position:fixed;inset:0;background:#000d;z-index:8;display:flex;align-items:center;justify-content:center;padding:14px;flex-direction:column;gap:10px}
#modal img{max-width:100%;max-height:78vh;border-radius:10px;overflow:auto}
</style></head><body>
<div id="splash"><div>⚠️ تنبيه<br>هذا الموقع مخصص للاستخدام داخل ماب روبلوكس اسمه <b>Emden</b> فقط.</div></div>

<div id="auth" class="hide"><div class="box">
<h1>⛽ مجمعين الغاز</h1>
<div class="tabs"><button id="tL">تسجيل دخول</button><button id="tS" class="g">إنشاء حساب</button></div>
<input id="nm" placeholder="الاسم" autocomplete="username" maxlength="20">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="go" style="width:100%;margin-top:6px">دخول</button>
<div id="am" class="msg"></div></div></div>

<div id="wait" class="hide"><div class="box" style="text-align:center"><h1>⏳ انتظار الموافقة</h1>
<p>تم إرسال طلبك. انتظر حتى يوافق عليه المؤسس.</p><div id="wm" class="msg"></div><button class="g" id="wOut">خروج</button></div></div>

<div id="app" class="hide">
<header><b id="hi"></b><span class="tag">⛽ Emden</span><button class="g" id="out">خروج</button></header>
<div class="grid">
<div>
<div class="card"><h2>حالتك</h2>
<div class="row"><button class="ok" id="bOn">في الخدمة</button><button class="no" id="bOff">خارج الخدمة</button></div>
<div id="st" class="tag"></div></div>
<div class="card" style="margin-top:12px"><h2>الأعضاء</h2><div id="ul"></div></div>
<div id="ownerBox" class="card hide" style="margin-top:12px"><h2>طلبات الانضمام</h2><div id="rq"></div></div>
</div>
<div class="card"><h2>عمليات تجميع الغاز</h2>
<div id="chat"></div><div id="ctl" class="hide"><button class="no" id="clr" style="margin-top:8px;width:100%">🗑 مسح الشات الآن</button><div class="row" style="align-items:center"><span class="tag">مسح تلقائي كل (دقيقة، 0 = بدون):</span><input id="am2" type="number" min="0" style="flex:1;margin:0"><button id="sv" style="flex:0 0 auto">حفظ</button></div></div>
<div class="row"><input id="ci" placeholder="اكتب رسالة..." style="flex:3;margin:0"><button id="cs" style="flex:1">إرسال</button></div>
<div class="row"><button class="ok" id="gas">✅ تم جمع حبة غاز</button><button class="g" id="how">📍 طريقة تجميع الغاز</button></div>
</div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// الصق إعدادات Firebase حقتك هنا (من Project settings > Your apps)
const firebaseConfig={
  apiKey:"PASTE_HERE",
  authDomain:"PASTE_HERE",
  projectId:"PASTE_HERE",
  storageBucket:"PASTE_HERE",
  messagingSenderId:"PASTE_HERE",
  appId:"PASTE_HERE"
};
</script>
<script>
const OWNER_HASH="cb2009cb83d8acdb4712d87a984b0d75c5c81b8bdf3152be3c510541b33ade69";
const $=id=>document.getElementById(id);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
let db=null,me=null,mode="L",unsubs=[];
const key=n=>n.trim().toLowerCase().replace(/[\/\\'"\s]/g,"_");
const show=v=>["auth","wait","app"].forEach(x=>$(x).classList.toggle("hide",x!==v));
const sv=()=>{try{return JSON.parse(localStorage.getItem("gs")||"null")}catch(e){return null}};
const ss=v=>{try{v?localStorage.setItem("gs",JSON.stringify(v)):localStorage.removeItem("gs")}catch(e){}};
setTimeout(()=>{$("splash").style.opacity=0;setTimeout(()=>$("splash").remove(),600);start()},5000);

$("tL").onclick=()=>setMode("L");$("tS").onclick=()=>setMode("S");
function setMode(m){mode=m;$("tL").className=m=="L"?"":"g";$("tS").className=m=="S"?"":"g";$("go").textContent=m=="L"?"دخول":"إنشاء الحساب";$("am").textContent=""}
function am(t,e){$("am").textContent=t;$("am").className="msg"+(e?" err":"")}

async function start(){
 try{firebase.initializeApp(firebaseConfig);db=firebase.firestore()}catch(e){db=null}
 if(!db){show("auth");am("تعذر الاتصال بقاعدة البيانات. تأكد من إعداد Firebase في الملف.",1);return}
 try{const o=db.collection("users").doc("owner");const s=await o.get();
  if(!s.exists)await o.set({name:"OWNER",hash:OWNER_HASH,status:"approved",duty:false,gas:0})}catch(e){}
 const x=sv();
 if(x){try{const s=await db.collection("users").doc(x.k).get();
   if(s.exists&&s.data().hash===x.h){return enter(x.k)}}catch(e){}ss(null)}
 show("auth")}

$("go").onclick=async()=>{
 const n=$("nm").value.trim(),p=$("pw").value;
 if(n.length<2||p.length<3)return am("اكتب اسم وكلمة مرور (٣ أحرف على الأقل)",1);
 if(!db)return am("لا يوجد اتصال بقاعدة البيانات",1);
 const k=key(n),h=await sha(k+":"+p),r=db.collection("users").doc(k);
 try{const s=await r.get();
  if(mode=="S"){
   if(s.exists)return am("الاسم مستخدم، اختر اسم ثاني",1);
   await r.set({name:n,hash:h,status:"pending",duty:false,gas:0,ts:Date.now()});
   ss({k,h});enter(k)}
  else{
   if(!s.exists||s.data().hash!==h)return am("الاسم أو كلمة المرور غلط",1);
   ss({k,h});enter(k)}
 }catch(e){am("صار خطأ، حاول مرة ثانية",1)}};

function clean(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function enter(k){
 clean();me=k;
 unsubs.push(db.collection("users").doc(k).onSnapshot(s=>{
  if(!s.exists){ss(null);show("auth");return}
  const d=s.data();
  if(d.status==="approved"){if($("app").classList.contains("hide")){show("app");init(d)}upd(d)}
  else if(d.status==="rejected"){$("wm").textContent="تم رفض طلبك.";show("wait")}
  else{$("wm").textContent="";show("wait")}}));
}
const lo=()=>{clean();ss(null);me=null;show("auth")};
$("out").onclick=lo;$("wOut").onclick=lo;

let chatRaw=[];let users=[],chatIds=[],chatMeta=[],autoMin=0;
function init(d){
 $("hi").textContent="👤 "+d.name;
 if(me==="owner"){$("ownerBox").classList.remove("hide");$("ctl").classList.remove("hide")}
 unsubs.push(db.collection("users").onSnapshot(s=>{users=s.docs.map(x=>({k:x.id,...x.data()}));renderU()}));
 unsubs.push(db.collection("chat").onSnapshot(s=>{
  chatIds=s.docs.map(x=>x.id);chatMeta=s.docs.map(x=>({id:x.id,ts:x.data().ts}));chatRaw=s.docs.map(x=>x.data());drawChat()}));
 unsubs.push(db.collection("settings").doc("chat").onSnapshot(x=>{autoMin=x.exists?(x.data().mins||0):0;if($("am2"))$("am2").value=autoMin||"";drawChat();sweep()}));
 function drawChat(){const a0=chatRaw.filter(m=>!autoMin||m.ts>Date.now()-autoMin*60000);const a=a0.sort((p,q)=>p.ts-q.ts).slice(-300);
  const c=$("chat");c.innerHTML="";
  a.forEach(m=>{const e=document.createElement("div");e.className="m"+(m.gas?" gas":"");
   const b=document.createElement("b");b.textContent=m.name;const sm=document.createElement("small");
   sm.textContent=new Date(m.ts).toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
   e.append(b,sm,document.createElement("br"),document.createTextNode(m.text));c.append(e)});
  c.scrollTop=c.scrollHeight}
 setInterval(()=>{drawChat();sweep()},30000);
}
function upd(d){$("st").textContent=d.duty?"أنت الآن في الخدمة ✅":"أنت الآن خارج الخدمة"}
function renderU(){
 const ul=$("ul");ul.innerHTML="";
 const ap=users.filter(u=>u.status==="approved").sort((a,b)=>(b.duty?1:0)-(a.duty?1:0));
 ap.forEach(u=>{const r=document.createElement("div");r.className="u";
  const l=document.createElement("span");const d=document.createElement("i");d.className="dot "+(u.duty?"on":"off");
  l.append(d,document.createTextNode(u.name+(u.duty&&u.gas?"  ⛽ "+u.gas:"")));
  const t=document.createElement("span");t.className="tag";t.textContent=u.duty?"في الخدمة":"خارج الخدمة";
  r.append(l,t);
  if(me==="owner"&&u.k!=="owner"){const x=document.createElement("button");x.className="no";x.style.padding="4px 8px";x.textContent="حذف";
   x.onclick=()=>{if(confirm("حذف "+u.name+"؟"))db.collection("users").doc(u.k).delete()};r.append(x)}
  ul.append(r)});
 if(me==="owner"){const q=$("rq");q.innerHTML="";
  const pd=users.filter(u=>u.status==="pending");
  if(!pd.length)q.innerHTML='<div class="tag">لا توجد طلبات</div>';
  pd.forEach(u=>{const r=document.createElement("div");r.className="u";
   const s=document.createElement("span");s.textContent=u.name;
   const a=document.createElement("button");a.className="ok";a.textContent="قبول";a.onclick=()=>db.collection("users").doc(u.k).update({status:"approved"});
   const x=document.createElement("button");x.className="no";x.textContent="رفض";x.onclick=()=>db.collection("users").doc(u.k).update({status:"rejected"});
   r.append(s,a,x);q.append(r)})}
}
const setDuty=v=>db.collection("users").doc(me).update({duty:v});
$("bOn").onclick=()=>setDuty(true);$("bOff").onclick=()=>setDuty(false);
async function say(text,gas){
 const u=users.find(x=>x.k===me);if(!u)return;
 const ts=Date.now();
 await db.collection("chat").doc(ts+"_"+Math.random().toString(36).slice(2,6)).set({name:u.name,text,ts,gas:!!gas})}
$("cs").onclick=async()=>{const v=$("ci").value.trim();if(!v)return;$("ci").value="";try{await say(v,0)}catch(e){}};
$("ci").onkeydown=e=>{if(e.key==="Enter")$("cs").click()};
$("gas").onclick=async()=>{
 const u=users.find(x=>x.k===me);if(!u)return;
 try{await say("تم جمع حبة غاز ⛽",1);await db.collection("users").doc(me).update({gas:(u.gas||0)+1})}catch(e){}};
async function sweep(){if(!autoMin||!db)return;const lim=Date.now()-autoMin*60000;
 for(const m of chatMeta){if(m.ts<lim){try{await db.collection("chat").doc(m.id).delete()}catch(e){}}}}
$("sv").onclick=async()=>{const v=Math.max(0,parseInt($("am2").value)||0);try{await db.collection("settings").doc("chat").set({mins:v})}catch(e){}};
$("clr").onclick=async()=>{if(!confirm("مسح كل رسائل الشات؟"))return;for(const i of chatIds){try{await db.collection("chat").doc(i).delete()}catch(e){}}};
$("how").onclick=()=>$("modal").classList.remove("hide");
$("mc").onclick=()=>$("modal").classList.add("hide");
</script></body></html>
